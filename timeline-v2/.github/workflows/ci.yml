name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Type Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: timeline-v2/package-lock.json

      - name: Install dependencies
        working-directory: timeline-v2
        run: npm ci

      - name: TypeScript type check
        working-directory: timeline-v2
        run: npx tsc --noEmit

      - name: Lint check
        working-directory: timeline-v2
        run: npm run lint

      - name: Build Next.js app
        working-directory: timeline-v2
        run: npm run build
        env:
          # Use dummy Firebase credentials for build verification
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || 'dummy-key-for-build' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || 'dummy.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'dummy-project' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || 'dummy.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || '1:000000000000:web:0000000000000000' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ matrix.node-version }}
          path: timeline-v2/.next
          retention-days: 7

  tauri-check:
    name: Tauri Configuration Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Cargo.toml syntax
        working-directory: timeline-v2/src-tauri
        run: cargo check --all-features

      - name: Verify Tauri config
        working-directory: timeline-v2/src-tauri
        run: |
          if [ -f tauri.conf.json ]; then
            echo "✓ tauri.conf.json exists"
          else
            echo "✗ tauri.conf.json missing"
            exit 1
          fi

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build, tauri-check]
    if: always()

    steps:
      - name: Build Status
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tauri | ${{ needs.tauri-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
