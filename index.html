// ─── Top Bar ──────────────────────────────────────────────────────────────────
// ─── Claude AI Panel ──────────────────────────────────────────────────────────
const ClaudePanel = ({ people, events, eras, onAddPerson, onAddEvent, onEditPerson, onEditEvent, onClose }) => {
  const [apiMsgs, setApiMsgs] = useState([]);
  const [display, setDisplay] = useState([]);
  const [input, setInput]     = useState('');
  const [loading, setLoading] = useState(false);
  const [serverOk, setServerOk] = useState(null); // null=unknown, true, false
  const endRef = useRef(null);

  // Check if backend is running on mount
  useEffect(() => {
    fetch('/health').then(r => r.ok ? setServerOk(true) : setServerOk(false)).catch(() => setServerOk(false));
  }, []);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [display]);

  const sendMessage = async () => {
    if (!input.trim() || loading) return;
    const userText = input.trim();
    setInput('');
    const newApiMsgs = [...apiMsgs, { role: 'user', content: userText }];
    setApiMsgs(newApiMsgs);
    setDisplay(prev => [
      ...prev,
      { role: 'user', content: userText },
      { role: 'assistant', content: '', streaming: true, appliedKeys: new Set() },
    ]);
    setLoading(true);
    try {
      const res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: newApiMsgs,
          context: {
            people: people.map(p => ({ id: p.id, name: p.name, birth: p.birth, death: p.death, role: p.role })),
            events: events.map(e => ({ id: e.id, title: e.title, start: e.date_start, end: e.date_end, category: e.category, description: e.description, person_ids: e.person_ids })),
            eras,
          },
        }),
      });
      if (!res.ok) { throw new Error(`Server returned ${res.status}`); }
      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let fullText  = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        for (const line of chunk.split('\n')) {
          if (!line.startsWith('data: ')) continue;
          let d;
          try { d = JSON.parse(line.slice(6)); } catch { continue; }
          if (d.type === 'text') {
            fullText += d.text;
            setDisplay(prev => {
              const u = [...prev];
              u[u.length - 1] = { ...u[u.length - 1], content: fullText };
              return u;
            });
          } else if (d.type === 'done') {
            setDisplay(prev => {
              const u = [...prev];
              u[u.length - 1] = { ...u[u.length - 1], streaming: false };
              return u;
            });
            setApiMsgs(m => [...m, { role: 'assistant', content: fullText }]);
          } else if (d.type === 'error') {
            fullText = `⚠ ${d.message}`;
            setDisplay(prev => {
              const u = [...prev];
              u[u.length - 1] = { ...u[u.length - 1], content: fullText, streaming: false, error: true };
              return u;
            });
          }
        }
      }
    } catch (e) {
      setDisplay(prev => {
        const u = [...prev];
        u[u.length - 1] = { ...u[u.length - 1], content: `⚠ ${e.message}`, streaming: false, error: true };
        return u;
      });
    }
    setLoading(false);
  };

  // Parse message content into text and action-block segments
  const parseBlocks = (content) => {
    const parts = [];
    const re = /```json\n(\{[\s\S]*?\})\n```/g;
    let last = 0, m;
    while ((m = re.exec(content)) !== null) {
      if (m.index > last) parts.push({ type: 'text', content: content.slice(last, m.index) });
      try {
        const data = JSON.parse(m[1]);
        if (['add_person','add_event','edit_person','edit_event'].includes(data.action)) {
          parts.push({ type: 'action', data, key: m.index });
        } else {
          parts.push({ type: 'text', content: m[0] });
        }
      } catch {
        parts.push({ type: 'text', content: m[0] });
      }
      last = m.index + m[0].length;
    }
    if (last < content.length) parts.push({ type: 'text', content: content.slice(last) });
    return parts;
  };

  const applyAction = (msgIdx, actionKey, data) => {
    if (data.action === 'add_person') onAddPerson(data);
    else if (data.action === 'add_event') onAddEvent(data);
    else if (data.action === 'edit_person') onEditPerson(data);
    else if (data.action === 'edit_event') onEditEvent(data);
    setDisplay(prev => {
      const u = [...prev];
      u[msgIdx] = { ...u[msgIdx], appliedKeys: new Set([...(u[msgIdx].appliedKeys || []), actionKey]) };
      return u;
    });
  };

  const fmtYear = y => {
    if (y == null) return '?';
    if (typeof y === 'number') return y <= 0 ? `${Math.abs(y)} BC` : `${y} AD`;
    return String(y).slice(0, 4);
  };

  const renderAssistant = (msg, msgIdx) => {
    const blocks = parseBlocks(msg.content);
    return (
      <div key={msgIdx} style={{ alignSelf: 'flex-start', maxWidth: '96%', display: 'flex', flexDirection: 'column', gap: 6 }}>
        {blocks.map((b, bi) => {
          if (b.type === 'text') {
            const txt = b.content.trim();
            if (!txt) return null;
            return (
              <div key={bi} style={{ background: '#1f2937', color: '#e5e7eb', padding: '9px 13px', borderRadius: '12px 12px 12px 2px', fontSize: 13, lineHeight: 1.65, whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>
                {txt}
              </div>
            );
          }
          // Action card
          const d = b.data;
          const isAdd    = d.action === 'add_person' || d.action === 'add_event';
          const isPerson = d.action === 'add_person' || d.action === 'edit_person';
          const isEdit   = d.action === 'edit_person' || d.action === 'edit_event';
          const applied  = (msg.appliedKeys || new Set()).has(b.key);
          const accent   = isPerson ? '#818cf8' : '#34d399';
          const editColor = '#fbbf24';
          const cardAccent = isEdit ? editColor : accent;
          // For edit cards, try to find the matching existing record
          const existingPerson = isEdit && isPerson ? people.find(p => p.id === d.id || p.name === d.name) : null;
          const existingEvent  = isEdit && !isPerson ? events.find(e => String(e.id) === String(d.id) || e.title === d.title) : null;
          return (
            <div key={bi} style={{ background: '#0d1117', border: `1px solid ${applied ? '#374151' : cardAccent}44`, borderRadius: 10, padding: '10px 13px', opacity: applied ? 0.6 : 1 }}>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: cardAccent, marginBottom: 5 }}>
                {d.action === 'add_person' ? '👤 Add Person' : d.action === 'add_event' ? '📅 Add Event' : d.action === 'edit_person' ? '✏️ Edit Person' : '✏️ Edit Event'}
              </div>
              <div style={{ color: '#f9fafb', fontWeight: 600, fontSize: 13 }}>{d.name || d.title}</div>
              {isPerson && (d.birth != null || d.death != null) && (
                <div style={{ color: '#9ca3af', fontSize: 11, marginTop: 2 }}>
                  {d.birth != null ? fmtYear(d.birth) : '?'} – {d.death != null ? fmtYear(d.death) : '?'}
                  {d.role ? ` · ${d.role}` : ''}
                </div>
              )}
              {!isPerson && (
                <div style={{ color: '#9ca3af', fontSize: 11, marginTop: 2 }}>
                  {fmtYear(d.start)}{d.end ? ` – ${fmtYear(d.end)}` : ''}
                  {d.category ? ` · ${d.category}` : ''}
                </div>
              )}
              {d.description && (
                <div style={{ color: '#6b7280', fontSize: 11, marginTop: 3, lineHeight: 1.5 }}>{d.description}</div>
              )}
              {isEdit && !existingPerson && !existingEvent && (
                <div style={{ color: '#ef4444', fontSize: 10, marginTop: 3 }}>⚠ Person/event not found in current timeline</div>
              )}
              {!applied && (
                <button onClick={() => applyAction(msgIdx, b.key, d)}
                  style={{ marginTop: 8, padding: '4px 14px', background: cardAccent + '22', border: `1px solid ${cardAccent}66`, borderRadius: 6, color: cardAccent, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>
                  {isEdit ? '✏ Apply Edit' : '+ Add to Timeline'}
                </button>
              )}
              {applied && <div style={{ marginTop: 8, fontSize: 11, color: '#4b5563' }}>✓ {isEdit ? 'Applied' : 'Added'}</div>}
            </div>
          );
        })}
        {msg.streaming && <span style={{ color: '#6b7280', fontSize: 13 }}>▌</span>}
      </div>
    );
  };

  const SUGGESTIONS = [
    'Add all Roman emperors from Augustus to Constantine',
    'What connections do you see in my current timeline?',
    'Suggest 5 pioneering women scientists to add',
    'Fill in gaps in the timeline between the people I have',
    'Update roles and descriptions for the people already on my timeline',
  ];

  return (
    <div style={{ position: 'fixed', bottom: 76, right: 20, width: 390, height: 520, background: '#111827', border: '1px solid #374151', borderRadius: 14, display: 'flex', flexDirection: 'column', zIndex: 600, boxShadow: '0 24px 64px rgba(0,0,0,.85)' }}>
      {/* Header */}
      <div style={{ padding: '11px 16px', borderBottom: '1px solid #1f2937', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
          <div style={{ width: 28, height: 28, borderRadius: 8, background: 'linear-gradient(135deg,#6366f1,#a855f7)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14 }}>🤖</div>
          <div>
            <div style={{ color: '#f9fafb', fontWeight: 700, fontSize: 13 }}>Claude AI</div>
            <div style={{ fontSize: 10, color: serverOk === false ? '#ef4444' : '#4ade80' }}>
              {serverOk === null ? '…' : serverOk ? 'Connected' : 'Server offline — run server.py'}
            </div>
          </div>
        </div>
        <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#6b7280', cursor: 'pointer', fontSize: 18, lineHeight: 1, padding: '2px 6px' }}>✕</button>
      </div>

      {/* Messages */}
      <div style={{ flex: 1, overflowY: 'auto', padding: 12, display: 'flex', flexDirection: 'column', gap: 8 }}>
        {display.length === 0 && (
          <div style={{ padding: '20px 0' }}>
            <div style={{ color: '#4b5563', fontSize: 13, textAlign: 'center', marginBottom: 16 }}>
              <div style={{ fontSize: 28, marginBottom: 6 }}>🏛️</div>
              Ask Claude to help build your timeline
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 5 }}>
              {SUGGESTIONS.map((s, i) => (
                <button key={i} onClick={() => setInput(s)}
                  style={{ background: '#1f2937', border: '1px solid #374151', borderRadius: 8, padding: '7px 11px', color: '#9ca3af', fontSize: 11, cursor: 'pointer', textAlign: 'left', lineHeight: 1.4 }}>
                  {s}
                </button>
              ))}
            </div>
          </div>
        )}
        {display.map((msg, i) => (
          msg.role === 'user'
            ? <div key={i} style={{ alignSelf: 'flex-end', background: '#4f46e5', color: '#fff', padding: '8px 13px', borderRadius: '12px 12px 2px 12px', maxWidth: '85%', fontSize: 13, lineHeight: 1.5, wordBreak: 'break-word' }}>{msg.content}</div>
            : renderAssistant(msg, i)
        ))}
        <div ref={endRef} />
      </div>

      {/* Input */}
      <div style={{ padding: '10px 12px', borderTop: '1px solid #1f2937', display: 'flex', gap: 7, flexShrink: 0 }}>
        <input value={input} onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }}
          placeholder="Ask Claude about history…"
          disabled={serverOk === false}
          style={{ flex: 1, padding: '8px 12px', background: '#0d1117', border: '1px solid #374151', borderRadius: 8, color: '#f9fafb', fontSize: 13, outline: 'none', opacity: serverOk === false ? 0.5 : 1 }} />
        <button onClick={sendMessage} disabled={loading || !input.trim() || serverOk === false}
          style={{ padding: '8px 14px', background: (loading || !input.trim() || serverOk === false) ? '#1f2937' : '#6366f1', color: '#fff', border: 'none', borderRadius: 8, cursor: (loading || !input.trim()) ? 'not-allowed' : 'pointer', fontSize: 14, fontWeight: 700, flexShrink: 0 }}>
          {loading ? '…' : '↑'}
        </button>
      </div>
    </div>
  );
};

// ─── Top Bar ───────────────────────────────────────────────────────────────────
const TopBar = ({ timelineName, searchQuery, setSearchQuery, onNew, onOpen, onSave, onExport, saveMsg, dateFormat, setDateFormat, onBg, onClaude, onAddPerson, onAddEvent, onHelp }) => (
  <div style={{ display:'flex', alignItems:'center', gap:10, padding:'9px 18px', background:'#0d1117', borderBottom:'1px solid #1f2937', flexShrink:0 }}>
    <div style={{ display:'flex', alignItems:'center', gap:10, flexShrink:0 }}>
      <div style={{ width:28, height:28, borderRadius:8, background:'linear-gradient(135deg,#6366f1,#818cf8)', display:'flex', alignItems:'center', justifyContent:'center' }}>
        <span style={{ color:'white', fontSize:14, fontWeight:700 }}>T</span>
      </div>
      <div>
        <div style={{ fontSize:13, fontWeight:600, color:'#f9fafb', maxWidth:180, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{timelineName}</div>
        <div style={{ fontSize:10, color:'#4b5563' }}>Timeline</div>
      </div>
    </div>
    <div style={{ display:'flex', gap:4, flexShrink:0 }}>
      <Btn small onClick={onNew}>New</Btn>
      <Btn small onClick={onOpen}>Open</Btn>
      <Btn small onClick={onSave} style={{ color: saveMsg ? '#4ade80' : '#9ca3af' }}>{saveMsg || 'Save'}</Btn>
      <Btn small onClick={onExport}>Export JSON</Btn>
      <Btn small onClick={onBg}>🎨 Default BG</Btn>
    </div>
    <div style={{ flex:1, maxWidth:320 }}>
      <input type="text" placeholder="Search events…" value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
        style={{ width:'100%', background:'#1f2937', border:'1px solid #374151', borderRadius:8, padding:'6px 12px', fontSize:13, color:'#f9fafb', outline:'none', boxSizing:'border-box' }}
        onFocus={e => e.target.style.borderColor='#6366f1'} onBlur={e => e.target.style.borderColor='#374151'} />
    </div>
    <div style={{ display:'flex', alignItems:'center', gap:6, marginLeft:'auto', flexShrink:0 }}>
      <label style={{ fontSize:11, color:'#4b5563', flexShrink:0 }}>Dates:</label>
      <select value={dateFormat} onChange={e => setDateFormat(e.target.value)}
        title={DATE_FMTS.find(f=>f.value===dateFormat)?.example}
        style={{ fontSize:11, padding:'3px 6px', background:'#1f2937', border:'1px solid #374151', borderRadius:6, color:'#9ca3af', cursor:'pointer', outline:'none' }}>
        {DATE_FMTS.map(f => <option key={f.value} value={f.value}>{f.label}</option>)}
      </select>
      <Btn small onClick={onAddPerson} style={{ background:'#6366f122', border:'1px solid #6366f144', color:'#a5b4fc' }}>+ Person</Btn>
      <Btn primary small onClick={onAddEvent}>+ Add Event</Btn>
      <Btn onClick={onClaude} style={{ background: 'linear-gradient(135deg,#6366f1,#a855f7)', color: '#fff', border: 'none', fontWeight: 600 }}>🤖 Claude</Btn>
      <Btn onClick={onHelp} title="Help" style={{ background:'#1f2937', border:'1px solid #374151', color:'#9ca3af', fontWeight:700, minWidth:30 }}>?</Btn>
    </div>
  </div>
);

// ─── App Root ─────────────────────────────────────────────────────────────────
const App = () => {
  const [timelineName, setTimelineName]             = useState('Sample Timeline');
  const [people, setPeople]                         = useState(SAMPLE_PEOPLE);
  const [events, setEvents]                         = useState(SAMPLE_EVENTS);
  const [selectedPeople, setSelectedPeople]         = useState(() => new Set(SAMPLE_PEOPLE.map(p => p.id)));
  const [selectedCategories, setSelectedCategories] = useState(() => new Set(ALL_CATEGORIES));
  const [selectedEvent, setSelectedEvent]           = useState(null);
  const [searchQuery, setSearchQuery]               = useState('');
  const [orientation, setOrientation]               = useState('horizontal');
  const [showNew, setShowNew]                       = useState(false);
  const [showOpen, setShowOpen]                     = useState(false);
  const [saveMsg, setSaveMsg]                       = useState('');
  const [dateFormat, setDateFormat]                 = useState('bcad');
  const [bgSettings, setBgSettings]                 = useState(DEFAULT_BG);
  const [showBg, setShowBg]                         = useState(false);
  const [eras, setEras]                             = useState(DEFAULT_ERAS);
  const [showEras, setShowEras]                     = useState(false);
  const [showClaude, setShowClaude]                 = useState(false);
  const [showAddPerson, setShowAddPerson]           = useState(false);
  const [showAddEvent, setShowAddEvent]             = useState(false);
  const [editPersonTarget, setEditPersonTarget]     = useState(null); // person object to edit
  const [editEventTarget, setEditEventTarget]       = useState(null); // event object to edit
  const [showHelp, setShowHelp]                     = useState(false);

  const loadTimeline = useCallback((name, newPeople, newEvents, newEras = null, newBg = null) => {
    setTimelineName(name); setPeople(newPeople); setEvents(newEvents);
    setSelectedPeople(new Set(newPeople.map(p => p.id))); setSelectedCategories(new Set(ALL_CATEGORIES));
    setSelectedEvent(null); setSearchQuery(''); setShowNew(false); setShowOpen(false);
    if (newEras !== null) setEras(newEras);
    if (newBg   !== null) setBgSettings(newBg);
  }, []);

  const handleNew    = (name, withSample) => loadTimeline(name, withSample ? SAMPLE_PEOPLE : [], withSample ? SAMPLE_EVENTS : [], [], DEFAULT_BG);
  const handleLoad   = (name, p, e, newEras = [], newBg = null) => loadTimeline(name, p, e, newEras, newBg);
  const handleSave   = () => { saveToStorage(timelineName, people, events, eras, bgSettings); setSaveMsg('Saved ✓'); setTimeout(() => setSaveMsg(''), 2200); };
  const handleExport = () => exportJSON(timelineName, people, events, eras, bgSettings);

  const handleAddPerson = useCallback((person) => {
    setPeople(prev => [...prev, person]);
    setSelectedPeople(prev => new Set([...prev, person.id]));
  }, []);

  const handleAddEvent = useCallback((event) => {
    setEvents(prev => [...prev, event]);
  }, []);

  // Edit person — updates person fields and syncs event connections
  const handleEditPerson = useCallback((personId, updates, linkedEventIds) => {
    const newName = updates.name || '';
    setPeople(prev => prev.map(p => {
      if (p.id !== personId) return p;
      return {
        ...p, ...updates,
        initials: newName.split(/\s+/).map(w => w[0]||'').join('').slice(0,2).toUpperCase() || '?',
      };
    }));
    // Sync event connections: add/remove personId from each event's person_ids
    setEvents(prev => prev.map(e => {
      const shouldLink = linkedEventIds.includes(e.id);
      const alreadyLinked = e.person_ids.includes(personId);
      if (shouldLink === alreadyLinked) return e;
      return {
        ...e,
        person_ids: shouldLink
          ? [...e.person_ids, personId]
          : e.person_ids.filter(id => id !== personId),
      };
    }));
  }, []);

  // Edit event — updates all event fields including person_ids
  const handleEditEvent = useCallback((eventId, updates) => {
    setEvents(prev => prev.map(e => e.id === eventId ? { ...e, ...updates } : e));
  }, []);

  // Quick toggle person on/off for an event (from EventPanel chips)
  const handleUpdateEventPersonIds = useCallback((eventId, newPersonIds) => {
    setEvents(prev => prev.map(e => e.id === eventId ? { ...e, person_ids: newPersonIds } : e));
  }, []);

  const handleUpdatePersonPhoto = useCallback((personId, photo) => setPeople(prev => prev.map(p => p.id===personId ? { ...p, photo } : p)), []);
  const handleUploadEventImage  = useCallback((eventId, dataUrl) => setEvents(prev => prev.map(e => e.id===eventId ? { ...e, images:[...(e.images||[]), dataUrl] } : e)), []);
  const handleRemoveEventImage  = useCallback((eventId, idx)     => setEvents(prev => prev.map(e => e.id===eventId ? { ...e, images:(e.images||[]).filter((_,i) => i!==idx) } : e)), []);

  // Claude AI — add/edit person/event from assistant suggestions
  const handleClaudeAddPerson = useCallback((data) => {
    const name = data.name || 'Unknown';
    const newPerson = {
      id: uid(), name,
      birth:    data.birth  != null ? data.birth  : null,
      death:    data.death  != null ? data.death  : null,
      role:     data.role   || '',
      color:    data.color  || '#818cf8',
      initials: name.split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase() || '?',
      photo:    null,
    };
    setPeople(prev => [...prev, newPerson]);
    setSelectedPeople(prev => new Set([...prev, newPerson.id]));
  }, []);

  const handleClaudeAddEvent = useCallback((data) => {
    setEvents(prev => [...prev, {
      id: uid(), title: data.title || 'Untitled Event',
      date_start: data.start ?? 0, date_end: data.end || null,
      description: data.description || '', category: data.category || 'Historical',
      person_ids: [], images: [],
    }]);
  }, []);

  const handleClaudeEditPerson = useCallback((data) => {
    setPeople(prev => prev.map(p => {
      if (p.id !== data.id && p.name !== data.name) return p;
      const name = data.name || p.name;
      return {
        ...p, name,
        ...(data.birth  != null ? { birth:    data.birth  } : {}),
        ...(data.death  != null ? { death:    data.death  } : {}),
        ...(data.role               ? { role:     data.role   } : {}),
        ...(data.color              ? { color:    data.color  } : {}),
        initials: name.split(/\s+/).map(w => w[0]||'').join('').slice(0,2).toUpperCase() || '?',
      };
    }));
  }, []);

  const handleClaudeEditEvent = useCallback((data) => {
    setEvents(prev => prev.map(e => {
      if (String(e.id) !== String(data.id) && e.title !== data.title) return e;
      return {
        ...e,
        ...(data.title       ? { title:       data.title       } : {}),
        ...(data.start  != null ? { date_start: data.start      } : {}),
        ...(data.end    != null ? { date_end:   data.end        } : {}),
        ...(data.description ? { description: data.description } : {}),
        ...(data.category    ? { category:    data.category    } : {}),
      };
    }));
  }, []);

  const visiblePeople = useMemo(() => people.filter(p => selectedPeople.has(p.id)), [people, selectedPeople]);
  const filteredEvents = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    return events.filter(e => {
      if (!e.person_ids.some(id => selectedPeople.has(id))) return false;
      if (!selectedCategories.has(e.category)) return false;
      if (q && !e.title.toLowerCase().includes(q) && !e.description.toLowerCase().includes(q)) return false;
      return true;
    });
  }, [events, selectedPeople, selectedCategories, searchQuery]);

  useEffect(() => { if (selectedEvent && !filteredEvents.find(e => e.id===selectedEvent.id)) setSelectedEvent(null); }, [filteredEvents]);
  const liveEvent = useMemo(() => selectedEvent ? (events.find(e => e.id===selectedEvent.id)||null) : null, [selectedEvent, events]);

  return (
    <DateFmtCtx.Provider value={dateFormat}>
    <div style={{ display:'flex', flexDirection:'column', height:'100vh', background:'#0a0f1e' }}>
      <TopBar timelineName={timelineName} searchQuery={searchQuery} setSearchQuery={setSearchQuery}
        onNew={() => setShowNew(true)} onOpen={() => setShowOpen(true)}
        onSave={handleSave} onExport={handleExport} saveMsg={saveMsg}
        dateFormat={dateFormat} setDateFormat={setDateFormat}
        onBg={() => setShowBg(true)} onClaude={() => setShowClaude(c => !c)}
        onAddPerson={() => setShowAddPerson(true)} onAddEvent={() => setShowAddEvent(true)}
        onHelp={() => setShowHelp(true)} />
      <div style={{ flex:1, display:'flex', overflow:'hidden', background:bgToCss(bgSettings) }}>
        {orientation !== 'data' && (
          <Sidebar people={people} events={events}
            selectedPeople={selectedPeople} setSelectedPeople={setSelectedPeople}
            selectedCategories={selectedCategories} setSelectedCategories={setSelectedCategories}
            onUpdatePersonPhoto={handleUpdatePersonPhoto}
            onAddPerson={() => setShowAddPerson(true)}
            onEditPerson={p => setEditPersonTarget(p)} />
        )}

        {orientation === 'horizontal' && <HorizontalTimeline events={filteredEvents} people={visiblePeople} onSelectEvent={setSelectedEvent} setOrientation={setOrientation} eras={eras} onEditEras={() => setShowEras(true)} />}
        {orientation === 'vertical'   && <VerticalTimeline   events={filteredEvents} people={visiblePeople} onSelectEvent={setSelectedEvent} selectedEvent={liveEvent} setOrientation={setOrientation} eras={eras} onEditEras={() => setShowEras(true)} />}
        {orientation === 'data'       && <DataView people={people} events={events} setPeople={setPeople} setEvents={setEvents} orientation={orientation} setOrientation={setOrientation} />}

        {liveEvent && orientation !== 'data' && (
          <EventPanel event={liveEvent} people={people} onClose={() => setSelectedEvent(null)}
            onUploadImage={handleUploadEventImage} onRemoveImage={handleRemoveEventImage}
            onUpdatePersonIds={handleUpdateEventPersonIds}
            onEditEvent={() => setEditEventTarget(liveEvent)} />
        )}
      </div>
      {showNew       && <NewTimelineModal  onConfirm={handleNew}  onClose={() => setShowNew(false)}  />}
      {showOpen      && <OpenTimelineModal onLoad={handleLoad}    onClose={() => setShowOpen(false)} />}
      {showBg        && <BgSettingsModal  bg={bgSettings} onSave={setBgSettings} onClose={() => setShowBg(false)} />}
      {showEras      && <EraEditorModal   eras={eras}     onSave={setEras}       onClose={() => setShowEras(false)} />}
      {showAddPerson && <AddPersonModal onAdd={p => { handleAddPerson(p); setShowAddPerson(false); }} onClose={() => setShowAddPerson(false)} />}
      {showAddEvent  && <AddEventModal  people={people} onAdd={e => { handleAddEvent(e); setShowAddEvent(false); }} onClose={() => setShowAddEvent(false)} />}
      {editPersonTarget && (
        <EditPersonModal
          person={editPersonTarget} events={events}
          onSave={(updates, linkedEventIds) => { handleEditPerson(editPersonTarget.id, updates, linkedEventIds); setEditPersonTarget(null); }}
          onClose={() => setEditPersonTarget(null)} />
      )}
      {editEventTarget && (
        <EditEventModal
          event={editEventTarget} people={people}
          onSave={updates => { handleEditEvent(editEventTarget.id, updates); setEditEventTarget(null); if (liveEvent?.id === editEventTarget.id) setSelectedEvent(prev => prev ? { ...prev, ...updates } : prev); }}
          onClose={() => setEditEventTarget(null)} />
      )}
      {showHelp && <HelpModal onClose={() => setShowHelp(false)} />}
      {showClaude && (
        <ClaudePanel
          people={people} events={events} eras={eras}
          onAddPerson={handleClaudeAddPerson}
          onAddEvent={handleClaudeAddEvent}
          onEditPerson={handleClaudeEditPerson}
          onEditEvent={handleClaudeEditEvent}
          onClose={() => setShowClaude(false)}
        />
      )}
      {/* Claude floating toggle button — always visible when panel is closed */}
      {!showClaude && (
        <button onClick={() => setShowClaude(true)}
          title="Open Claude AI assistant"
          style={{ position: 'fixed', bottom: 20, right: 20, width: 52, height: 52, borderRadius: '50%', background: 'linear-gradient(135deg,#6366f1,#a855f7)', border: 'none', cursor: 'pointer', fontSize: 22, boxShadow: '0 4px 20px rgba(99,102,241,.5)', zIndex: 599, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          🤖
        </button>
      )}
    </div>
    </DateFmtCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
