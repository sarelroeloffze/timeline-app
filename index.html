const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ─── Date Helpers ─────────────────────────────────────────────────────────────
const makeYear = (year, month = 6, day = 1) => {
  const d = new Date(0); d.setFullYear(year, month - 1, day); return d;
};
const dateForVis = d => (d == null ? undefined : typeof d === 'number' ? makeYear(d) : d);
const toSortYear = d => typeof d === 'number' ? d : parseInt(String(d));

// Month abbreviations for full-date format
const MONTH_ABR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Core date formatter — fmt: 'bcad' | 'signed' | 'full'
const fmtDate = (d, fmt = 'bcad') => {
  if (d == null) return '';
  if (typeof d === 'number') {
    if (fmt === 'signed') return String(d);
    if (d <= 0) return `${Math.abs(d)} BC`;
    return d < 1000 ? `${d} AD` : String(d);
  }
  // ISO string  e.g. "1867-11-07"
  const s = String(d);
  const yr = parseInt(s.slice(0, 4));
  if (fmt === 'full') {
    const mm = parseInt(s.slice(5, 7)) - 1; // 0-based
    const dd = parseInt(s.slice(8, 10));
    if (!isNaN(mm) && !isNaN(dd) && s.length >= 10) return `${dd} ${MONTH_ABR[mm]} ${yr}`;
  }
  return String(yr); // 'bcad' and 'signed' → just year for ISO dates
};

// ─── Date Format Context ───────────────────────────────────────────────────────
const DateFmtCtx = React.createContext('bcad');
// Hook: returns a bound fmtDate(d) that uses current context format
const useFmt = () => { const fmt = React.useContext(DateFmtCtx); return d => fmtDate(d, fmt); };

// Date format options for the picker
const DATE_FMTS = [
  { value:'bcad',   label:'BC / AD',     example:'4 BC · 33 AD · 1867' },
  { value:'signed', label:'Signed year', example:'-4 · 33 · 1867' },
  { value:'full',   label:'Full date',   example:'7 Nov 1867 · 4 BC' },
];

// Parse a date value from user text input
// Accepts: "4 BC", "33 AD", "-4", "1867", "1867-11-07", "25/12/1867", "25/12/33 AD", "25/12/4 BC"
const parseDate = (s) => {
  if (!s || !String(s).trim()) return undefined;
  const t = String(s).trim();

  // Already an ISO date string (yyyy-mm-dd…)
  if (/^\d{4}-\d{2}-\d{2}/.test(t)) return t;

  // dd/mm/yyyy  or  dd/mm/yyyy BC  or  dd/mm/yyyy AD
  const dmy = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{1,4})\s*(BC|AD)?$/i);
  if (dmy) {
    const [, dd, mm, yyyy, era] = dmy;
    const yr = parseInt(yyyy);
    const signed = (era && era.toUpperCase() === 'BC') ? -Math.abs(yr) : yr;
    // If it has a real day/month, store as ISO-like string; keep year negative for BC
    const absYr = Math.abs(signed);
    const isoStr = `${String(absYr).padStart(4,'0')}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
    // Return integer year for BC (no standard ISO for negative years), full ISO for AD
    if (signed <= 0) return signed; // BC stored as integer year
    return isoStr;
  }

  // "4 BC" or "4BC"  →  -4
  const bc = t.match(/^(\d{1,4})\s*BC$/i);
  if (bc) return -Math.abs(parseInt(bc[1]));

  // "33 AD" or "33AD"  →  33
  const ad = t.match(/^(\d{1,4})\s*AD$/i);
  if (ad) return parseInt(ad[1]);

  // Plain negative integer: -4
  if (/^-\d{1,4}$/.test(t)) return parseInt(t);

  // Plain positive integer: 1867
  if (/^\d{1,4}$/.test(t)) return parseInt(t);

  return t; // fallback — keep as-is
};

// Human-readable display of a stored date value (for grid/panel)
const displayDate = (d) => {
  if (d == null) return '';
  if (typeof d === 'number') return d <= 0 ? `${Math.abs(d)} BC` : `${d} AD`;
  return String(d); // ISO string
};

// ─── Image Helper ─────────────────────────────────────────────────────────────
const resizeImage = (file, maxW, maxH, quality = 0.85) => new Promise((resolve, reject) => {
  if (file.type === 'image/svg+xml') {
    const r = new FileReader(); r.onload = e => resolve(e.target.result); r.onerror = reject; r.readAsDataURL(file); return;
  }
  const isPNG = file.type === 'image/png';
  const r = new FileReader();
  r.onload = e => {
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(maxW / img.width, maxH / img.height, 1);
      const w = Math.round(img.width * ratio), h = Math.round(img.height * ratio);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      if (!isPNG) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL(isPNG ? 'image/png' : 'image/jpeg', quality));
    };
    img.onerror = reject; img.src = e.target.result;
  };
  r.onerror = reject; r.readAsDataURL(file);
});

// ─── CSV Helpers ──────────────────────────────────────────────────────────────
// Parse one CSV line handling quoted fields with embedded commas
const parseCSVLine = (line) => {
  const out = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"' && line[i+1] === '"') { cur += '"'; i++; }
    else if (line[i] === '"') inQ = !inQ;
    else if (line[i] === ',' && !inQ) { out.push(cur); cur = ''; }
    else cur += line[i];
  }
  out.push(cur); return out;
};

const parseCSV = (text) => {
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim().split('\n').filter(l => l.trim());
  if (lines.length < 2) return { headers: [], rows: [] };
  const headers = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
  const rows = lines.slice(1).map(l => {
    const vals = parseCSVLine(l);
    const obj = {}; headers.forEach((h, i) => obj[h] = (vals[i] || '').trim()); return obj;
  });
  return { headers, rows };
};

const toCSVValue = v => {
  const s = String(v ?? '');
  return (s.includes(',') || s.includes('"') || s.includes('\n')) ? `"${s.replace(/"/g, '""')}"` : s;
};

const buildCSV = (headers, rows) =>
  [headers.join(','), ...rows.map(r => headers.map(h => toCSVValue(r[h] ?? '')).join(','))].join('\n');

const downloadText = (content, filename, mime = 'text/csv') => {
  const url = URL.createObjectURL(new Blob([content], { type: mime }));
  Object.assign(document.createElement('a'), { href: url, download: filename }).click();
  URL.revokeObjectURL(url);
};

const PEOPLE_HEADERS  = ['id','name','birth','death','role','color'];
const EVENTS_HEADERS  = ['id','title','date_start','date_end','description','category','person_ids'];

const EVENTS_TEMPLATE = `id,title,date_start,date_end,description,category,person_ids\n,Birth in Bethlehem,-4,,Description here,Religion,\n,World War II,1939,1945,Deadliest conflict in history,Historical,`;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

// Convert app people array → CSV rows
const peopleToCsvRows  = ps => ps.map(p => ({ id: p.id, name: p.name, birth: displayDate(p.birth), death: displayDate(p.death), role: p.role || '', color: p.color || '' }));
const eventsToCsvRows  = es => es.map(e => ({ id: e.id, title: e.title, date_start: displayDate(e.date_start), date_end: displayDate(e.date_end), description: e.description || '', category: e.category || '', person_ids: (e.person_ids || []).join('|') }));

// Convert CSV rows → app people/events
const csvRowToPerson = (row, existing = []) => ({
  id:       row.id || ('p' + uid()),
  name:     row.name || 'Unnamed',
  birth:    parseDate(row.birth),
  death:    parseDate(row.death),
  role:     row.role || '',
  color:    row.color || '#818cf8',
  initials: (row.name || 'XX').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase(),
  photo:    existing.find(p => p.id === row.id)?.photo || null,
});
const csvRowToEvent = (row, existing = []) => ({
  id:         row.id ? (isNaN(row.id) ? row.id : Number(row.id)) : uid(),
  title:      row.title || 'Untitled',
  date_start: parseDate(row.date_start),
  date_end:   parseDate(row.date_end) || undefined,
  description:row.description || '',
  category:   row.category || 'Historical',
  person_ids: row.person_ids ? row.person_ids.split(/[|,]/).map(s => s.trim()).filter(Boolean) : [],
  images:     existing.find(e => String(e.id) === String(row.id))?.images || [],
});

// ─── LocalStorage ─────────────────────────────────────────────────────────────
const LS_KEY = 'timeline_app_v1';
const loadSaves         = () => { try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; } };
const writeSaves        = arr => localStorage.setItem(LS_KEY, JSON.stringify(arr));
const deleteFromStorage = name => writeSaves(loadSaves().filter(s => s.name !== name));
const saveToStorage     = (name, people, events, eras = [], bgSettings = null) => {
  const saves = loadSaves(), idx = saves.findIndex(s => s.name === name);
  const entry = { name, savedAt: new Date().toISOString(), people, events, eras, bgSettings };
  if (idx >= 0) saves[idx] = entry; else saves.push(entry); writeSaves(saves);
};
const exportJSON = (name, people, events, eras = [], bgSettings = null) => {
  const url = URL.createObjectURL(new Blob([JSON.stringify({ name, version: 1, savedAt: new Date().toISOString(), people, events, eras, bgSettings }, null, 2)], { type: 'application/json' }));
  Object.assign(document.createElement('a'), { href: url, download: `${name || 'timeline'}.json` }).click();
  URL.revokeObjectURL(url);
};

// ─── Shared atoms ─────────────────────────────────────────────────────────────
const Avatar = ({ person, size = 32, dim = false, onUpload = null }) => {
  const fileRef = useRef(null);
  const [hov, setHov] = useState(false);
  const handleFile = async e => {
    const f = e.target.files[0]; if (!f || !onUpload) return;
    try { onUpload(person.id, await resizeImage(f, 300, 300)); } catch { alert('Could not load image.'); }
    e.target.value = '';
  };
  return (
    <div style={{ position:'relative', width:size, height:size, flexShrink:0, cursor:onUpload?'pointer':'default' }}
      onClick={() => onUpload && fileRef.current?.click()}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}>
      {person.photo
        ? <img src={person.photo} style={{ width:size, height:size, borderRadius:'50%', objectFit:'cover', display:'block', border:`2px solid ${person.color}` }} />
        : <div style={{ width:size, height:size, borderRadius:'50%', background:dim?'#374151':person.color, display:'flex', alignItems:'center', justifyContent:'center', fontSize:Math.round(size*.34), fontWeight:700, color:'white' }}>{person.initials}</div>
      }
      {onUpload && hov && <div style={{ position:'absolute', inset:0, borderRadius:'50%', background:'rgba(0,0,0,.55)', display:'flex', alignItems:'center', justifyContent:'center', fontSize:Math.round(size*.38) }}>📷</div>}
      {onUpload && <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{ display:'none' }} />}
    </div>
  );
};

const Lightbox = ({ src, onClose }) => {
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({ x:0, y:0 });
  const [dragging, setDragging] = useState(false);
  const dragStart = useRef(null);

  const handleWheel = e => {
    e.preventDefault();
    setScale(s => Math.max(0.5, Math.min(10, s * (e.deltaY < 0 ? 1.15 : 0.87))));
  };
  const handleMouseDown = e => {
    if (e.button !== 0) return;
    e.stopPropagation();
    setDragging(true);
    dragStart.current = { x: e.clientX - offset.x, y: e.clientY - offset.y };
  };
  const handleMouseMove = e => {
    if (!dragging || !dragStart.current) return;
    setOffset({ x: e.clientX - dragStart.current.x, y: e.clientY - dragStart.current.y });
  };
  const handleMouseUp = () => { setDragging(false); dragStart.current = null; };
  const resetZoom = () => { setScale(1); setOffset({ x:0, y:0 }); };

  return (
    <div
      onWheel={handleWheel}
      onMouseMove={handleMouseMove}
      onMouseUp={handleMouseUp}
      onMouseLeave={handleMouseUp}
      onClick={e => { if (e.target === e.currentTarget && scale <= 1) onClose(); }}
      style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.93)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden', cursor: scale > 1 ? (dragging ? 'grabbing' : 'grab') : 'default' }}>
      <button onClick={onClose} style={{ position:'absolute', top:16, right:20, color:'#9ca3af', background:'none', border:'none', fontSize:30, cursor:'pointer', zIndex:1 }}>×</button>
      {/* Zoom indicator + controls */}
      <div style={{ position:'absolute', bottom:20, left:'50%', transform:'translateX(-50%)', display:'flex', alignItems:'center', gap:8, background:'rgba(0,0,0,.6)', borderRadius:20, padding:'5px 12px', zIndex:1 }}>
        <button onClick={() => setScale(s => Math.max(0.5, s * 0.8))} style={{ background:'none', border:'none', color:'#9ca3af', fontSize:16, cursor:'pointer', lineHeight:1, padding:'0 2px' }}>−</button>
        <span style={{ fontSize:12, color:'#9ca3af', minWidth:40, textAlign:'center' }}>{Math.round(scale*100)}%</span>
        <button onClick={() => setScale(s => Math.min(10, s * 1.25))} style={{ background:'none', border:'none', color:'#9ca3af', fontSize:16, cursor:'pointer', lineHeight:1, padding:'0 2px' }}>+</button>
        {scale !== 1 && <button onClick={resetZoom} style={{ background:'none', border:'none', color:'#6b7280', fontSize:10, cursor:'pointer', marginLeft:4 }}>Reset</button>}
      </div>
      <div style={{ position:'absolute', bottom:54, left:'50%', transform:'translateX(-50%)', color:'#4b5563', fontSize:11 }}>Scroll to zoom · Drag to pan</div>
      <img
        src={src}
        onMouseDown={handleMouseDown}
        onDoubleClick={resetZoom}
        draggable={false}
        style={{
          maxWidth: scale <= 1 ? '92vw' : 'none',
          maxHeight: scale <= 1 ? '90vh' : 'none',
          objectFit:'contain',
          borderRadius:6,
          transform: `translate(${offset.x}px, ${offset.y}px) scale(${scale})`,
          transformOrigin:'center center',
          transition: dragging ? 'none' : 'transform .1s',
          userSelect:'none',
          pointerEvents:'all',
          cursor: scale > 1 ? (dragging ? 'grabbing' : 'grab') : 'zoom-in',
        }}
      />
    </div>
  );
};

// ─── Background helpers ────────────────────────────────────────────────────────
// bgSettings shape: { type:'solid'|'gradient'|'photo', color:'#0a0f1e', color2:'#1a2044', dir:'to right', photo:null }
const DEFAULT_BG = { type:'solid', color:'#0a0f1e', color2:'#1a2044', dir:'to bottom right', photo:null };
const bgToCss = (bg) => {
  if (!bg) return '#0a0f1e';
  if (bg.type === 'photo' && bg.photo) return `url('${bg.photo}') center/cover no-repeat`;
  if (bg.type === 'gradient') return `linear-gradient(${bg.dir}, ${bg.color}, ${bg.color2})`;
  return bg.color;
};
const BG_DIRS = ['to right','to left','to bottom','to top','to bottom right','to bottom left','to top right','to top left'];

// ─── Background Settings Modal ─────────────────────────────────────────────────
const BgSettingsModal = ({ bg, onSave, onClose }) => {
  const [draft, setDraft] = useState({ ...DEFAULT_BG, ...bg });
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  const fileRef = useRef(null);

  const handlePhoto = e => {
    const f = e.target.files[0]; if (!f) return;
    resizeImage(f, 1920, 1080, 0.88).then(url => set('photo', url));
    e.target.value = '';
  };

  const rowStyle = { display:'flex', alignItems:'center', gap:10, marginBottom:14 };
  const labelStyle = { fontSize:12, color:'#9ca3af', width:90, flexShrink:0 };
  const typeBtn = (val, label) => (
    <button onClick={() => set('type', val)}
      style={{ padding:'5px 13px', borderRadius:6, border:'1px solid', fontSize:12, cursor:'pointer',
        borderColor: draft.type===val ? '#6366f1' : '#374151',
        background:  draft.type===val ? '#6366f122' : 'none',
        color:       draft.type===val ? '#a5b4fc'   : '#6b7280' }}>
      {label}

  return (
    <Modal title="Timeline Background" onClose={onClose} width={420}>
      <div>
        {/* Type selector */}
        <div style={{ display:'flex', gap:8, marginBottom:20 }}>
          {typeBtn('solid','Solid colour')}
          {typeBtn('gradient','Gradient')}
          {typeBtn('photo','Photo')}
        </div>

        {/* Solid */}
        {draft.type === 'solid' && (
          <div style={rowStyle}>
            <span style={labelStyle}>Colour</span>
            <input type="color" value={draft.color} onChange={e => set('color', e.target.value)}
              style={{ width:44, height:32, border:'none', borderRadius:6, cursor:'pointer', padding:2, background:'none' }} />
            <span style={{ fontSize:12, color:'#6b7280' }}>{draft.color}</span>
          </div>
        )}

        {/* Gradient */}
        {draft.type === 'gradient' && (<>
          <div style={rowStyle}>
            <span style={labelStyle}>Colour 1</span>
            <input type="color" value={draft.color} onChange={e => set('color', e.target.value)}
              style={{ width:44, height:32, border:'none', borderRadius:6, cursor:'pointer', padding:2, background:'none' }} />
            <span style={{ fontSize:12, color:'#6b7280' }}>{draft.color}</span>
          </div>
          <div style={rowStyle}>
            <span style={labelStyle}>Colour 2</span>
            <input type="color" value={draft.color2} onChange={e => set('color2', e.target.value)}
              style={{ width:44, height:32, border:'none', borderRadius:6, cursor:'pointer', padding:2, background:'none' }} />
            <span style={{ fontSize:12, color:'#6b7280' }}>{draft.color2}</span>
          </div>
          <div style={rowStyle}>
            <span style={labelStyle}>Direction</span>
            <select value={draft.dir} onChange={e => set('dir', e.target.value)}
              style={{ flex:1, padding:'5px 10px', background:'#1f2937', border:'1px solid #374151', borderRadius:6, color:'#e5e7eb', fontSize:12 }}>
              {BG_DIRS.map(d => <option key={d} value={d}>{d}</option>)}
            </select>
          </div>
        </>)}

        {/* Photo */}
        {draft.type === 'photo' && (
          <div style={{ marginBottom:14 }}>
            {draft.photo
              ? <div style={{ position:'relative', borderRadius:8, overflow:'hidden', marginBottom:10 }}>
                  <img src={draft.photo} style={{ width:'100%', height:140, objectFit:'cover', display:'block' }} />
                  <button onClick={() => set('photo', null)}
                    style={{ position:'absolute', top:6, right:6, background:'rgba(0,0,0,.65)', border:'none', color:'white', borderRadius:4, padding:'2px 8px', cursor:'pointer', fontSize:11 }}>Remove</button>
                </div>
              : <div className="drop-zone" onClick={() => fileRef.current.click()} style={{ marginBottom:10 }}>
                  <div style={{ fontSize:22, marginBottom:4 }}>🖼</div>
                  <div style={{ fontSize:13 }}>Click to choose a background photo</div>
                  <div style={{ fontSize:11, marginTop:3 }}>JPG · PNG · WebP (auto-resized to 1920×1080)</div>
                </div>
            }
            <input ref={fileRef} type="file" accept="image/*" onChange={handlePhoto} style={{ display:'none' }} />
          </div>
        )}

        {/* Live preview swatch */}
        <div style={{ borderRadius:8, height:52, marginBottom:18, background:bgToCss(draft), border:'1px solid #374151' }} />

        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <Btn onClick={onClose}>Cancel</Btn>
          <Btn primary onClick={() => { onSave(draft); onClose(); }}>Apply</Btn>

  );

const OpenTimelineModal = ({ onLoad, onClose }) => {
  const [saves, setSaves] = useState(loadSaves);
  const fileRef = useRef(null);
  const handleDelete = (name, e) => { e.stopPropagation(); deleteFromStorage(name); setSaves(loadSaves()); };
  const handleFile = e => {
    const file = e.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => { try { const d = JSON.parse(ev.target.result); if (!Array.isArray(d.people)||!Array.isArray(d.events)) throw 0; onLoad(d.name||file.name.replace('.json',''), d.people, d.events, d.eras||[], d.bgSettings||null); } catch { alert('Invalid JSON timeline file.'); } };
    r.readAsText(file); e.target.value = '';
  };
  return (
    <Modal title="Open Timeline" onClose={onClose} width={460}>
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {saves.length===0 ? <p style={{ fontSize:13, color:'#6b7280', padding:'8px 0' }}>No saved timelines yet.</p>
          : saves.map(s => (
            <div key={s.name} style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', borderRadius:8, background:'#1f2937', border:'1px solid #374151' }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:13, fontWeight:600, color:'#f9fafb', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{s.name}</div>
                <div style={{ fontSize:11, color:'#6b7280', marginTop:2 }}>{s.people.length} people · {s.events.length} events · {new Date(s.savedAt).toLocaleDateString()}</div>
              </div>
              <button onClick={e => handleDelete(s.name, e)} style={{ fontSize:11, color:'#6b7280', background:'none', border:'none', cursor:'pointer', padding:'2px 6px' }}>✕</button>
              <Btn primary small onClick={() => onLoad(s.name, s.people, s.events, s.eras||[], s.bgSettings||null)}>Open</Btn>
            </div>
          ))}

// ─── CSV Import Modal ─────────────────────────────────────────────────────────
const ImportCSVModal = ({ people, events, onImportPeople, onImportEvents, onClose }) => {

  const [dragOver, setDragOver]   = useState(false);
  const [preview, setPreview]     = useState(null);   // { rows, error }
  const [mode, setMode]           = useState('merge'); // 'merge' | 'replace'
  const fileRef = useRef(null);

  const processText = (text) => {
    const { headers, rows } = parseCSV(text);
    if (rows.length === 0) { setPreview({ rows: [], error: 'No data rows found.' }); return; }
    setPreview({ rows, headers, error: null });
  };

  const handleFile = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = ev => processText(ev.target.result); r.readAsText(f); e.target.value = ''; };
  const handleDrop = e => { e.preventDefault(); setDragOver(false); const f = e.dataTransfer.files[0]; if (f) { const r = new FileReader(); r.onload = ev => processText(ev.target.result); r.readAsText(f); } };

  const doImport = () => {
    if (!preview?.rows?.length) return;
    if (tab === 'people') {
      const imported = preview.rows.map(r => csvRowToPerson(r, people));
      onImportPeople(imported, mode); onClose();
    } else {
      const imported = preview.rows.map(r => csvRowToEvent(r, events));
      onImportEvents(imported, mode); onClose();

  const tabStyle = active => ({ padding:'6px 16px', borderRadius:'6px 6px 0 0', border:'none', background:active?'#1f2937':'none', color:active?'#f9fafb':'#6b7280', cursor:'pointer', fontSize:13, fontWeight:active?600:400 });

        {/* Tabs */}

        <div style={{ background:'#1f2937', borderRadius:8, padding:'10px 14px', fontSize:12, color:'#9ca3af', lineHeight:1.7 }}>
          {tab === 'people'
            ? <><strong style={{ color:'#e5e7eb' }}>People columns:</strong> id (optional), name, birth, death, role, color (hex)<br/>Dates: <code style={{ color:'#c084fc' }}>4 BC</code> · <code style={{ color:'#c084fc' }}>33 AD</code> · <code style={{ color:'#c084fc' }}>1867</code> · <code style={{ color:'#c084fc' }}>25/12/1867</code> · <code style={{ color:'#c084fc' }}>1867-11-07</code></>
            : <><strong style={{ color:'#e5e7eb' }}>Events columns:</strong> id (optional), title, date_start, date_end (optional), description, category, person_ids<br/>person_ids: pipe-separated person IDs — <code style={{ color:'#c084fc' }}>p1|p3</code>. Categories: {ALL_CATEGORIES.join(', ')}</>
          }
          <br/><button onClick={downloadTemplate} style={{ marginTop:4, fontSize:11, color:'#818cf8', background:'none', border:'none', cursor:'pointer', padding:0 }}>⬇ Download {tab} template CSV</button>
        </div>

        {/* Drop zone */}
        {!preview && (

            onDragOver={e => { e.preventDefault(); setDragOver(true); }}
            onDragLeave={() => setDragOver(false)}

            onClick={() => fileRef.current.click()}>
            <div style={{ fontSize:28, marginBottom:8 }}>📂</div>

                    {preview.rows.slice(0,5).map((row,i) => (

// ─── Date Entry Widget ────────────────────────────────────────────────────────
// Floating panel shown when editing a date cell.
// Supports two independent entry modes:
//   'year'  → year number + BC / AD toggle  → stored as integer (-4, 33, 1867)
//   'full'  → native date picker (AD only)  → stored as "yyyy-mm-dd"
// Both types can coexist on the same timeline.
const DateEntryWidget = ({ value, onCommit, onCancel, anchorRef }) => {
  const ref = useRef(null);

  // Detect initial mode from stored value type
  const isIso = typeof value === 'string' && /^\d{4}-\d{2}-\d{2}/.test(String(value));
  const [mode, setMode] = useState(isIso ? 'full' : 'year');

  // Compute fixed position from anchor element so the widget escapes overflow:auto parents
  const [pos, setPos] = useState({ top:0, left:0 });
  useEffect(() => {
    if (anchorRef?.current) {
      const r = anchorRef.current.getBoundingClientRect();
      setPos({ top: r.bottom + 2, left: r.left });
    }
  }, [anchorRef]);

  // Year-mode state
  const initYear = () => {
    if (value == null) return 2000;
    if (typeof value === 'number') return Math.abs(value) || 2000;
    return Math.abs(parseInt(String(value))) || 2000;
  };
  const [year, setYear] = useState(initYear);
  const [bc, setBc] = useState(typeof value === 'number' && value <= 0);

  // Full-date mode state — keep as "yyyy-mm-dd" for the native picker
  const toInputDate = v => {
    if (!v) return '';
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0, 10);
    if (typeof v === 'number' && v > 0) return `${String(v).padStart(4, '0')}-06-01`;
    return '';
  };
  const [dateStr, setDateStr] = useState(toInputDate(value));

  // Also support free-text dd/mm/yyyy entry in full-date mode
  const [rawText, setRawText] = useState('');
  const [useText, setUseText] = useState(false);

  // Close on outside click
  useEffect(() => {
    const close = e => { if (ref.current && !ref.current.contains(e.target)) onCancel(); };
    const id = setTimeout(() => document.addEventListener('mousedown', close), 0);
    return () => { clearTimeout(id); document.removeEventListener('mousedown', close); };
  }, [onCancel]);

  const doCommit = () => {
    if (mode === 'year') {
      const yr = Math.abs(parseInt(year) || 1);
      onCommit(bc ? -yr : yr);
    } else if (useText) {
      const parsed = parseDate(rawText);
      if (parsed != null) onCommit(parsed); else onCancel();
    } else {
      if (dateStr) onCommit(dateStr); else onCancel();
    }
  };

  const handleKey = e => {
    if (e.key === 'Enter') { e.preventDefault(); doCommit(); }
    if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
  };

  // Preview string — shows what will actually be stored
  const preview = mode === 'year'
    ? (bc ? `${Math.abs(parseInt(year)||0)} BC` : `${parseInt(year)||0} AD`)
    : useText ? (rawText || '—') : (dateStr ? dateStr : '—');

  const tabBtn = (m, label) => (
    <button onClick={() => setMode(m)} style={{
      flex:1, padding:'6px 0', border:'none', borderBottom:`2px solid ${mode===m ? '#6366f1' : 'transparent'}`,
      background:'none', color: mode===m ? '#a5b4fc' : '#6b7280', fontSize:12, fontWeight: mode===m ? 600 : 400, cursor:'pointer',
    }}>{label}</button>
  );

  const togBtn = (active, label, onClick) => (
    <button onClick={onClick} style={{
      padding:'5px 12px', borderRadius:6, border:'1px solid', fontSize:12, cursor:'pointer',
      borderColor: active ? '#6366f1' : '#374151',
      background:  active ? '#6366f122' : '#0d1117',
      color:       active ? '#a5b4fc'   : '#6b7280',
    }}>{label}</button>
  );

  return (
    <div ref={ref} onKeyDown={handleKey}
      style={{ position:'fixed', top:pos.top, left:pos.left, background:'#1f2937', border:'1px solid #374151', borderRadius:10, padding:'14px 16px', minWidth:260, boxShadow:'0 8px 28px rgba(0,0,0,.6)', zIndex:9999 }}>

      {/* Mode tabs */}
      <div style={{ display:'flex', borderBottom:'1px solid #374151', marginBottom:14 }}>
        {tabBtn('year', 'Year  (BC / AD)')}
        {tabBtn('full', 'Full date')}
      </div>

      {/* ── Year mode ── */}
      {mode === 'year' && (
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <input autoFocus type="number" min={1} value={year}
              onChange={e => setYear(e.target.value)}
              style={{ width:90, padding:'7px 10px', background:'#0d1117', border:'1px solid #374151', borderRadius:6, color:'#f9fafb', fontSize:13, outline:'none' }} />
            {togBtn(!bc, 'AD', () => setBc(false))}
            {togBtn( bc, 'BC', () => setBc(true))}
          </div>
          <div style={{ fontSize:11, color:'#4b5563' }}>
            Enter the year number. Use BC for dates before year 1.
          </div>
        </div>
      )}

      {/* ── Full date mode ── */}
      {mode === 'full' && (
        <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
          {!useText ? (
            <>
              <input autoFocus type="date" value={dateStr} onChange={e => setDateStr(e.target.value)}
                style={{ width:'100%', padding:'7px 10px', background:'#0d1117', border:'1px solid #374151', borderRadius:6, color:'#f9fafb', fontSize:13, outline:'none', colorScheme:'dark', boxSizing:'border-box' }} />
              <button onClick={() => setUseText(true)}
                style={{ fontSize:11, color:'#4b5563', background:'none', border:'none', cursor:'pointer', textAlign:'left', padding:0 }}>
                Type instead (dd/mm/yyyy) →
              </button>
            </>
          ) : (
            <>
              <input autoFocus type="text" value={rawText} onChange={e => setRawText(e.target.value)}
                placeholder="25/12/1867 or 1867-11-07"
                style={{ width:'100%', padding:'7px 10px', background:'#0d1117', border:'1px solid #374151', borderRadius:6, color:'#f9fafb', fontSize:13, outline:'none', boxSizing:'border-box' }} />
              <button onClick={() => setUseText(false)}
                style={{ fontSize:11, color:'#4b5563', background:'none', border:'none', cursor:'pointer', textAlign:'left', padding:0 }}>
                ← Use date picker
              </button>
            </>
          )}
          <div style={{ fontSize:11, color:'#4b5563' }}>
            Full dates are AD only. Use the <em>Year</em> tab for BC dates.
          </div>
        </div>
      )}

      {/* Preview + actions */}
      <div style={{ marginTop:14, paddingTop:12, borderTop:'1px solid #1f2937', display:'flex', alignItems:'center', gap:8 }}>
        <div style={{ flex:1, fontSize:11, color:'#6b7280' }}>
          Stores as: <span style={{ color:'#c084fc', fontWeight:600 }}>{preview}</span>
        </div>
        <Btn small onClick={onCancel}>Cancel</Btn>
        <Btn small primary onClick={doCommit}>OK</Btn>
      </div>
    </div>
  );
};

// ─── Data Grid ────────────────────────────────────────────────────────────────
const DataGrid = ({ columns, rows, onUpdate, onAdd, onDelete, extraCellProps = {} }) => {
  const fmt = useFmt();
  const [editing, setEditing] = useState(null); // { row, col }
  const [val, setVal]         = useState('');
  const inputRef              = useRef(null);
  const dateAnchorRef         = useRef(null); // ref passed to DateEntryWidget for fixed positioning

  useEffect(() => { if (editing) setTimeout(() => inputRef.current?.focus(), 0); }, [editing]);

  const startEdit = (ri, col) => {
    const raw = rows[ri][col.key];
    setEditing({ row: ri, col: col.key });
    setVal(col.type === 'date' ? displayDate(raw) : col.type === 'person' ? (raw||[]).join('|') : String(raw ?? ''));
  };

  const commit = useCallback((ri, colKey) => {
    const col = columns.find(c => c.key === colKey);
    if (!col) return;
    let v = val.trim();
    if (col.type === 'date')   v = parseDate(v);
    if (col.type === 'person') v = v ? v.split(/[|,]/).map(s => s.trim()).filter(Boolean) : [];
    onUpdate(ri, colKey, v);
    setEditing(null);
  }, [val, columns, onUpdate]);

  const handleKey = (e, ri, colKey) => {
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); commit(ri, colKey); }
    else if (e.key === 'Escape') setEditing(null);
  };

  const renderCell = (row, ri, col) => {
    const isEditing = editing?.row === ri && editing?.col === col.key;
    const raw = row[col.key];

    if (isEditing) {
      // Date columns get the DateEntryWidget — fixed-position panel so it escapes overflow:auto
      if (col.type === 'date') return (
        <span ref={dateAnchorRef} style={{ display:'block', minHeight:33, cursor:'pointer' }}>
          <DateEntryWidget
            value={raw}
            anchorRef={dateAnchorRef}
            onCommit={v => { onUpdate(ri, col.key, v); setEditing(null); }}
            onCancel={() => setEditing(null)}
          />
        </span>
      );
      if (col.type === 'select') return (
        <select autoFocus className="dg-select" value={val} onChange={e => { setVal(e.target.value); onUpdate(ri, col.key, e.target.value); setEditing(null); }}
          onBlur={() => setEditing(null)} ref={inputRef}>
          {col.options.map(o => <option key={o} value={o}>{o}</option>)}
        </select>
      );
      if (col.type === 'color') return (
        <input ref={inputRef} type="color" value={val||'#818cf8'} style={{ width:'100%', height:33, border:'none', background:'none', cursor:'pointer', padding:'4px 6px', boxSizing:'border-box' }}
          onChange={e => setVal(e.target.value)} onBlur={() => { onUpdate(ri, col.key, val); setEditing(null); }} />
      );
      if (col.type === 'person') return (
        <select autoFocus className="dg-select" value={val.split('|')[0]||''} onChange={e => { const v = e.target.value; setVal(v); onUpdate(ri, col.key, v ? [v] : []); setEditing(null); }}
          onBlur={() => setEditing(null)} ref={inputRef}>
          <option value="">— none —</option>
          {(extraCellProps.people||[]).map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      );
      return (
        <input ref={inputRef} className="dg-input" value={val} onChange={e => setVal(e.target.value)}
          onBlur={() => commit(ri, col.key)} onKeyDown={e => handleKey(e, ri, col.key)}
          placeholder={col.hint || ''} />
      );
    }

    // Display mode
    let display = '';
    if (col.type === 'date')   display = fmt(raw);
    else if (col.type === 'color')  display = <span style={{ display:'flex', alignItems:'center', gap:7 }}><span style={{ width:14, height:14, borderRadius:3, background:raw||'#818cf8', flexShrink:0, display:'inline-block' }}/>{raw}</span>;
    else if (col.type === 'select') display = <Badge category={raw} />;
    else if (col.type === 'person') display = (extraCellProps.people||[]).filter(p => (raw||[]).includes(p.id)).map(p => p.name).join(', ') || <span style={{ color:'#4b5563' }}>—</span>;
    else display = String(raw ?? '');

    return <span className="dg-cell" onClick={() => startEdit(ri, col)}>{display || <span style={{ color:'#374151' }}>—</span>}</span>;
  };

  return (
    <div style={{ overflowX:'auto', overflowY:'auto', flex:1 }}>
      <table className="dg-table">
        <thead>
          <tr>
            {columns.map(col => <th key={col.key} style={{ width:col.width }}>{col.label}</th>)}
            <th style={{ width:36 }}></th>
          </tr>
        </thead>
        <tbody>
          {rows.map((row, ri) => (
            <tr key={row.id ?? ri} className="dg-row">
              {columns.map(col => (
                <td key={col.key} style={{ maxWidth:col.width, width:col.width }}>
                  {renderCell(row, ri, col)}
                </td>
              ))}
              <td style={{ textAlign:'center' }}>
                <button className="dg-del" onClick={() => onDelete(ri)} title="Delete row">✕</button>
              </td>
            </tr>
          ))}
          <tr>
            <td colSpan={columns.length + 1} style={{ padding:'6px 10px' }}>
              <button onClick={onAdd} style={{ fontSize:12, color:'#6366f1', background:'none', border:'1px dashed #374151', borderRadius:6, padding:'4px 14px', cursor:'pointer', width:'100%' }}>+ Add row</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  );
};

};

// ─── Horizontal Timeline ──────────────────────────────────────────────────────
const HorizontalTimeline = ({ events, people, onSelectEvent, setOrientation, eras, onEditEras }) => {
  const dateFmt = React.useContext(DateFmtCtx); // raw format string for HTML-string rendering
  const containerRef = useRef(null), timelineRef = useRef(null), itemsRef = useRef(null), groupsRef = useRef(null);
  const overlayRef = useRef(null), erasRef = useRef(eras);
  erasRef.current = eras;
  const onSelectRef = useRef(onSelectEvent), eventsRef = useRef(events);
  onSelectRef.current = onSelectEvent; eventsRef.current = events;
  const [visYearSpan, setVisYearSpan] = useState(2045); // current visible year range width

  // Draw per-section backgrounds behind the timeline content
  const redrawEras = useCallback(() => {
    const tl = timelineRef.current, overlay = overlayRef.current;
    if (!tl || !overlay) return;
    const win = tl.getWindow();
    const winStart = win.start.getTime(), winEnd = win.end.getTime(), winDur = winEnd - winStart;
    const center = containerRef.current?.querySelector('.vis-panel.vis-center');
    const w = center ? center.clientWidth : 0;
    const leftW = containerRef.current?.querySelector('.vis-panel.vis-left')?.clientWidth || 0;
    overlay.style.left = leftW + 'px';
    overlay.style.width = w + 'px';
    overlay.innerHTML = '';
    for (const era of erasRef.current) {
      const s = makeYear(era.yearStart).getTime();
      const e = era.yearEnd != null ? makeYear(era.yearEnd).getTime() : win.end.getTime() + winDur;
      const x1 = (s - winStart) / winDur * w;
      const x2 = (e - winStart) / winDur * w;
      const cx1 = Math.max(0, x1), cx2 = Math.min(w, x2);
      if (cx2 <= cx1) continue;

      // Resolve this era's background (fall back gracefully for old eras without bg)
      const bg = era.bg || { type:'solid', color: era.color || '#1a1f2e', color2:'#2d3748', dir:'to right', photo:null };

      // For photo backgrounds we calculate an offset so the image appears to stretch
      // continuously across the visible window rather than repeating per section
      let bgStyle = '';
      if (bg.type === 'photo' && bg.photo) {
        // Position the image so its left edge aligns with x1 relative to the overlay,
        // giving the illusion the photo covers the full timeline span for this section.
        const offsetX = -cx1; // shift image left by the hidden portion
        bgStyle = `background:url('${bg.photo}') ${offsetX}px 0/auto 100% no-repeat;`;
      } else if (bg.type === 'gradient') {
        bgStyle = `background:linear-gradient(${bg.dir||'to right'},${bg.color},${bg.color2||'#2d3748'});`;
      } else {
        bgStyle = `background:${bg.color||'#1a1f2e'};`;
      }

      const div = document.createElement('div');
      div.style.cssText = `position:absolute;top:0;left:${cx1}px;width:${cx2-cx1}px;height:100%;${bgStyle}pointer-events:none;overflow:hidden;`;

      // Era label — shown when section is wide enough
      if (cx2 - cx1 > 46) {
        const lbl = document.createElement('div');
        lbl.textContent = era.label;
        lbl.style.cssText = `position:absolute;bottom:6px;left:7px;font-size:10px;color:${era.color||'#9ca3af'};font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,.9);pointer-events:none;white-space:nowrap;`;
        div.appendChild(lbl);
      }
      overlay.appendChild(div);
    }
  }, []);

  useEffect(() => {
    if (!containerRef.current) return;
    const groups = new vis.DataSet([]), items = new vis.DataSet([]);
    groupsRef.current = groups; itemsRef.current = items;
    const tl = new vis.Timeline(containerRef.current, items, groups, {
      height:'100%', start:makeYear(-20), end:makeYear(2025), min:makeYear(-100), max:makeYear(2040),
      zoomMin:1000*60*60*24*365*2, zoomMax:1000*60*60*24*365*2100,
      margin:{ item:{ horizontal:6, vertical:4 } }, orientation:{ axis:'top' }, align:'center',
      selectable:true, editable:false, showCurrentTime:false, stack:true, tooltip:{ followMouse:true, overflowMethod:'cap' },
    });
    timelineRef.current = tl;
    tl.on('select', ({ items:sel }) => onSelectRef.current(sel.length>0 ? (eventsRef.current.find(e => e.id===sel[0])||null) : null));
    tl.on('rangechanged', () => {
      redrawEras();
      const win = tl.getWindow();
      const span = (win.end.getTime() - win.start.getTime()) / (1000*60*60*24*365.25);
      setVisYearSpan(Math.round(span));
    });
    tl.on('changed', () => redrawEras());
    return () => { tl.destroy(); timelineRef.current = null; };
  }, [redrawEras]);

  // Re-draw era bands whenever eras array changes
  useEffect(() => { redrawEras(); }, [eras, redrawEras]);

  useEffect(() => {
    const ds = groupsRef.current; if (!ds) return;
    ds.clear();
    ds.add(people.map(p => ({ id:p.id, content:`<div style="display:flex;align-items:center;gap:7px;padding:5px 0;">${p.photo?`<img src="${p.photo}" style="width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid ${p.color};flex-shrink:0;">`:`<div style="width:26px;height:26px;border-radius:50%;background:${p.color};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:white;flex-shrink:0;">${p.initials}</div>`}<div><div style="font-size:11px;color:#e5e7eb;font-weight:500;white-space:nowrap;">${p.name}</div><div style="font-size:10px;color:#6b7280;">${fmtDate(p.birth,dateFmt)}–${fmtDate(p.death,dateFmt)}</div></div></div>` })));
    timelineRef.current?.redraw();
  }, [people, dateFmt]);

  const showImgInBar = visYearSpan < 80; // show images inside bars when zoomed in
  useEffect(() => {
    const ds = itemsRef.current; if (!ds) return;
    ds.clear();
    ds.add(events.map(e => {
      const col = CATEGORY_COLORS[e.category]||'#6b7280';
      const sl = fmtDate(e.date_start, dateFmt), el = e.date_end ? ` – ${fmtDate(e.date_end, dateFmt)}` : '';
      const hasImg = e.images?.length > 0;
      // When zoomed in and event has images, embed the first image inside the bar
      const content = (showImgInBar && hasImg)
        ? `<div style="display:flex;align-items:center;gap:5px;height:100%;overflow:hidden;padding:2px 0;"><img src="${e.images[0]}" style="height:100%;max-height:36px;width:auto;aspect-ratio:4/3;object-fit:cover;border-radius:3px;flex-shrink:0;border:1px solid ${col}66;" /><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.title}</span></div>`
        : e.title + (hasImg ? ' 🖼' : '');
      return { id:e.id, content, start:dateForVis(e.date_start), end:dateForVis(e.date_end), group:e.person_ids[0], type:e.date_end?'range':'box', style:`background-color:${col}1a;border-color:${col};color:${col};border-width:2px;`, title:`<strong style="display:block;margin-bottom:3px;">${e.title}</strong><span style="color:#9ca3af;font-size:11px;">${sl}${el} · ${e.category}</span><br/><span style="font-size:11px;color:#d1d5db;">${e.description.slice(0,100)}${e.description.length>100?'…':''}</span>` };
    }));
  }, [events, dateFmt, showImgInBar]);

  const goTo = (yr, sp=30) => timelineRef.current?.setWindow(makeYear(yr-Math.round(sp/2)), makeYear(yr+Math.round(sp/2)), { animation:{ duration:600, easingFunction:'easeInOutQuad' } });
  const fitAll  = () => timelineRef.current?.fit({ animation:{ duration:700, easingFunction:'easeInOutQuad' } });
  const zoomIn  = () => timelineRef.current?.zoomIn(0.5, { animation:true });
  const zoomOut = () => timelineRef.current?.zoomOut(0.5, { animation:true });

  const NAV = [{ label:'1 AD',yr:1,sp:80 },{ label:'30 AD',yr:30,sp:20 },{ label:'1000',yr:1000,sp:200 },{ label:'1500',yr:1500,sp:200 },{ label:'1900',yr:1900,sp:40 },{ label:'1950',yr:1950,sp:30 },{ label:'2000',yr:2000,sp:30 }];

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', minWidth:0 }}>
      <div style={{ display:'flex', alignItems:'center', gap:5, padding:'6px 12px', borderBottom:'1px solid #1f2937', background:'#0d1117', flexShrink:0, flexWrap:'wrap' }}>
        <Btn small onClick={() => setOrientation('vertical')}  style={{ fontWeight:600 }}>⇕ Vertical</Btn>
        <Btn small onClick={() => setOrientation('data')}      style={{ fontWeight:600 }}>📊 Data</Btn>
        <div style={{ width:1, height:14, background:'#1f2937', margin:'0 2px' }} />
        <Btn small onClick={fitAll}>Fit All</Btn>
        <Btn small onClick={zoomIn}  style={{ fontFamily:'monospace' }}>+</Btn>
        <Btn small onClick={zoomOut} style={{ fontFamily:'monospace' }}>−</Btn>
        <Btn small onClick={onEditEras} style={{ color: eras.length > 0 ? '#a5b4fc' : '#6b7280' }}>🌈 Eras{eras.length > 0 ? ` (${eras.length})` : ''}</Btn>
        <div style={{ width:1, height:14, background:'#1f2937', margin:'0 2px' }} />
        {NAV.map(({ label,yr,sp }) => <Btn key={label} small onClick={() => goTo(yr,sp)} style={{ fontVariantNumeric:'tabular-nums' }}>{label}</Btn>)}
        <div style={{ marginLeft:'auto', display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:11, color:'#4b5563' }}>{events.length} events</span>
          <div style={{ display:'flex', gap:6 }}>{ALL_CATEGORIES.map(c => <div key={c} style={{ display:'flex', alignItems:'center', gap:3 }}><CategoryDot category={c} size={5}/><span style={{ fontSize:10, color:'#4b5563' }}>{c}</span></div>)}</div>
        </div>
      </div>
      {/* Timeline + era overlay wrapper */}
      <div style={{ flex:1, position:'relative', overflow:'hidden' }}>
        {/* Era colour-band overlay — sits behind the timeline content */}
        <div ref={overlayRef} style={{ position:'absolute', top:0, bottom:0, pointerEvents:'none', zIndex:0 }} />
        {/* vis-timeline sets its container to position:relative — wrap it so height:100% resolves correctly */}
        <div style={{ position:'absolute', top:0, left:0, right:0, bottom:0, overflow:'hidden', zIndex:1 }}>
          <div ref={containerRef} style={{ width:'100%', height:'100%' }} />
        </div>
      </div>
    </div>
  );
};

// ─── Vertical Timeline ────────────────────────────────────────────────────────
// Helper: find which era (if any) a given year falls in
const eraForYear = (eras, year) =>
  eras.find(era => year >= era.yearStart && (era.yearEnd == null || year < era.yearEnd)) || null;

const VerticalTimeline = ({ events, people, onSelectEvent, selectedEvent, setOrientation, eras, onEditEras }) => {
  const fmt = useFmt();
  const [sortDesc, setSortDesc] = useState(false);
  const [zoom, setZoom] = useState(1.0);
  const zoomIn  = () => setZoom(z => Math.min(3, parseFloat((z + 0.1).toFixed(1))));
  const zoomOut = () => setZoom(z => Math.max(0.4, parseFloat((z - 0.1).toFixed(1))));
  const sorted = useMemo(() => {
    const a = [...events].sort((a,b) => toSortYear(a.date_start) - toSortYear(b.date_start));
    return sortDesc ? a.reverse() : a;
  }, [events, sortDesc]);

  // Build a render list: interleave era section banners between events when the era changes
  const renderItems = useMemo(() => {
    const items = [];
    let lastEraId = null;
    for (const e of sorted) {
      const yr = toSortYear(e.date_start);
      const era = eraForYear(eras, yr);
      const eraId = era ? era.id : '__none__';
      if (eraId !== lastEraId) {
        items.push({ type:'era-banner', era, key:'banner-' + eraId });
        lastEraId = eraId;
      }
      items.push({ type:'event', event:e, era });
    }
    return items;
  }, [sorted, eras]);

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', minWidth:0 }}>
      <div style={{ display:'flex', alignItems:'center', gap:5, padding:'6px 12px', borderBottom:'1px solid #1f2937', background:'#0d1117', flexShrink:0 }}>
        <Btn small onClick={() => setOrientation('horizontal')} style={{ fontWeight:600 }}>⇔ Horizontal</Btn>
        <Btn small onClick={() => setOrientation('data')}       style={{ fontWeight:600 }}>📊 Data</Btn>
        <div style={{ width:1, height:14, background:'#1f2937', margin:'0 2px' }} />
        <Btn small onClick={() => setSortDesc(v => !v)}>{sortDesc ? '↓ Newest first' : '↑ Oldest first'}</Btn>
        <Btn small onClick={onEditEras} style={{ color: eras.length > 0 ? '#a5b4fc' : '#6b7280' }}>🌈 Sections{eras.length > 0 ? ` (${eras.length})` : ''}</Btn>
        <div style={{ width:1, height:14, background:'#1f2937', margin:'0 2px' }} />
        <Btn small onClick={zoomOut} style={{ fontFamily:'monospace' }}>−</Btn>
        <span style={{ fontSize:11, color:'#4b5563', minWidth:34, textAlign:'center' }}>{Math.round(zoom*100)}%</span>
        <Btn small onClick={zoomIn}  style={{ fontFamily:'monospace' }}>+</Btn>
        {zoom !== 1 && <Btn small onClick={() => setZoom(1)} style={{ color:'#4b5563' }}>Reset</Btn>}
        <div style={{ marginLeft:'auto' }}><span style={{ fontSize:11, color:'#4b5563' }}>{events.length} events</span></div>
      </div>

      <div style={{ flex:1, overflowY:'auto' }}>
        <div style={{ zoom }}>
        {sorted.length===0 && <div style={{ padding:60, textAlign:'center', color:'#374151', fontSize:13 }}>No events to show</div>}

        {renderItems.map(item => {
          // ── Era section banner ──
          if (item.type === 'era-banner') {
            const era = item.era;
            if (!era) return null; // no banner for unassigned time
            const bg = era.bg || DEFAULT_ERA_BG;
            return (
              <div key={item.key} style={{ background:bgToCss(bg), padding:'10px 32px', display:'flex', alignItems:'center', gap:10, borderBottom:'1px solid rgba(255,255,255,.07)' }}>

                <span style={{ fontSize:10, color:'rgba(255,255,255,.3)', marginLeft:4 }}>
                  {era.yearStart <= 0 ? Math.abs(era.yearStart)+' BC' : era.yearStart+' AD'} – {era.yearEnd == null ? 'present' : era.yearEnd <= 0 ? Math.abs(era.yearEnd)+' BC' : era.yearEnd+' AD'}
                </span>
              </div>
            );
          }

          // ── Event card ──
          const e = item.event, era = item.era;
          const bg = era?.bg || null;
          const person = people.find(p => e.person_ids.includes(p.id));
          const col = CATEGORY_COLORS[e.category]||'#6b7280', sel = selectedEvent?.id===e.id;
          // Era-tinted card background (solid only, subtle)
          const cardBg = sel ? '#1f2937' : (bg?.type==='solid' ? bg.color+'44' : '#111827');
          return (
            <div key={e.id} style={{ padding:'0 32px', background: era ? bgToCss(bg)+'22' : 'transparent' }}>

                  <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:5 }}>
                    {person && <div style={{ width:22, height:22, borderRadius:'50%', overflow:'hidden', flexShrink:0, border:`1.5px solid ${person.color}` }}>{person.photo?<img src={person.photo} style={{ width:'100%',height:'100%',objectFit:'cover' }}/>:<div style={{ width:'100%',height:'100%',background:person.color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,fontWeight:700,color:'white' }}>{person.initials}</div>}</div>}
                    <div style={{ fontSize:13, fontWeight:600, color:'#f9fafb', flex:1 }}>{e.title}</div>
                    <span style={{ fontSize:10, fontWeight:600, padding:'1px 6px', borderRadius:3, background:col+'22', color:col, border:`1px solid ${col}44`, flexShrink:0 }}>{e.category}</span>
                  </div>
                  <div style={{ fontSize:12, color:'#9ca3af', lineHeight:1.5, paddingLeft:30 }}>{e.description.slice(0,130)}{e.description.length>130?'…':''}</div>
                  {e.images?.length>0 && <div style={{ display:'flex', gap:5, marginTop:8, paddingLeft:30 }}>{e.images.slice(0,4).map((s,i)=><img key={i} src={s} style={{ width:52,height:38,objectFit:'cover',borderRadius:5,border:'1px solid #374151' }}/>)}{e.images.length>4&&<div style={{ width:52,height:38,borderRadius:5,background:'#1f2937',border:'1px solid #374151',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,color:'#6b7280' }}>+{e.images.length-4}</div>}</div>}
                </div>
              </div>
            </div>
          );
        })}
        <div style={{ height:40 }} />
        </div>{/* end zoom wrapper */}
      </div>
    </div>
  );
};

// ─── DateInput (inline date field for modals) ─────────────────────────────────
const DateInput = ({ value, onChange, label, optional = false, autoFocus = false }) => {
  const [raw, setRaw] = useState(() => {
    if (value == null) return '';
    if (typeof value === 'number') return value <= 0 ? `${Math.abs(value)} BC` : String(value);
    return String(value);
  });
  const parsed = raw.trim() ? parseDate(raw) : null;
  const valid  = !raw.trim() || parsed != null;
  const preview = !raw.trim() ? '' : parsed != null ? displayDate(parsed) : '⚠ not recognised';
  const handleChange = e => {
    const v = e.target.value; setRaw(v);
    const p = parseDate(v);
    onChange(p != null ? p : (!v.trim() ? null : undefined));
  };
  return (
    <div>
      {label && <label style={{ fontSize:11, color:'#6b7280', display:'block', marginBottom:4 }}>
        {label}{optional && <span style={{ color:'#374151' }}> (optional)</span>}
      </label>}
      <input autoFocus={autoFocus} type="text" value={raw} onChange={handleChange}
        placeholder="100 BC · 1867 · 1867-11-07"
        style={{ width:'100%', padding:'7px 10px', background:'#0d1117', border:`1px solid ${valid?'#374151':'#ef444466'}`, borderRadius:6, color:'#f9fafb', fontSize:13, outline:'none', boxSizing:'border-box' }}
        onFocus={e => e.target.style.borderColor='#6366f1'} onBlur={e => e.target.style.borderColor=valid?'#374151':'#ef444466'} />
      {preview && <div style={{ fontSize:10, color:preview.startsWith('⚠')?'#ef4444':'#4b5563', marginTop:3 }}>→ {preview}</div>}
    </div>
  );
};
